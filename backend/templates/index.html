<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Excel File</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2rem;
        }
        form {
            max-width: 400px;
        }
    </style>
</head>
<body>

    <h1>Upload an Excel (.xlsx) file</h1>

    <form method="POST" enctype="multipart/form-data">
        <div>
            <input
                type="file"
                name="file"
                accept=".xlsx"
                required
            >
        </div>

        <br>

        <button type="submit">Upload</button>
    </form>

</body>
</html>
